<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ch-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ch-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- ClickHouse style data columns (MergeTree parts) in background -->
  <rect x="22" y="58" width="6" height="24" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="32" y="44" width="6" height="38" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="42" y="32" width="6" height="50" rx="2" fill="url(#ch-yellow)"/>
  <rect x="52" y="48" width="6" height="34" rx="2" fill="url(#ch-red)"/>
  <rect x="62" y="26" width="6" height="56" rx="2" fill="url(#ch-yellow)"/>
  <rect x="72" y="40" width="6" height="42" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="82" y="52" width="6" height="30" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="92" y="60" width="6" height="22" rx="2" fill="#475569" opacity="0.6"/>

  <!-- Magnifying Lens Circle -->
  <circle cx="56" cy="52" r="30" fill="#0f172a" fill-opacity="0.45" stroke="url(#lens-rim)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="56" cy="52" r="27" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Inner active parts focus inside lens -->
  <rect x="42" y="34" width="6" height="36" rx="2" fill="#fef08a"/>
  <rect x="52" y="44" width="6" height="26" rx="2" fill="#fca5a5"/>
  <rect x="62" y="28" width="6" height="42" rx="2" fill="#38bdf8"/>

  <!-- Lens Handle -->
  <path d="M78 74 L100 96" stroke="url(#lens-rim)" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 76 L98 94" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Focal spark -->
  <circle cx="45" cy="40" r="1.5" fill="#ffffff"/>
</svg>
